name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aetherion-mobile/package-lock.json

      - name: Install dependencies
        working-directory: aetherion-mobile
        run: npm ci

      - name: Build Android APK
        working-directory: aetherion-mobile
        run: npx eas-cli build --platform android --profile production --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from Expo
        run: |
          # Wait for build to finish and get the URL
          BUILD_URL=$(cd aetherion-mobile && npx eas-cli build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.applicationUrl')
          test -n "$BUILD_URL" && test "$BUILD_URL" != "null"
          curl -L "$BUILD_URL" -o aetherion-android.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aetherion-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
