# Optional isolated college services. Run alongside the workspace compose file.
services:
  college-advanced-research:
    build:
      context: ../..
      dockerfile: deploy/workspace/Dockerfile
    profiles: [colleges]
    restart: unless-stopped
    command: [uvicorn, institution.service:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    environment:
      AETHERION_COLLEGE: "Advanced Research"
      AETHERION_REQUIRE_AUTH: "true"
      AETHERION_API_KEYS: ${AETHERION_API_KEYS:?Required}
      AETHERION_JWT_SECRET: ${AETHERION_JWT_SECRET:?Required}
      AETHERION_CHAT_MODEL: ${AETHERION_CHAT_MODEL:?Required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Required}
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
